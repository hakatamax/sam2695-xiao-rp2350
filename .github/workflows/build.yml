# ============================================================================
# Project: SAM2695 Emulator for XIAO RP2350
# File: .github/workflows/build.yml
# Version: v1.0.7
# Date: 2026-10-08
# Description: GitHub Actions Workflow for Building RP2350 UF2 Firmware
# ============================================================================

name: Build RP2350 UF2

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Raspberry Pi公式のアクションでArmツールチェーンとPico SDK環境を一括セットアップ
      - name: Setup Pico SDK & Arm Toolchain
        uses: raspberrypi/pico-sdk-tools-action@v1
        with:
          sdk-version: '2.1.0'

      - name: Build Firmware
        run: |
          mkdir build && cd build
          cmake -DPICO_BOARD=pico2 ..
          make -j$(nproc)

      - name: Rename UF2 with Timestamp
        run: |
          TIMESTAMP=$(TZ=Asia/Tokyo date +'%Y%m%d_%H%M%S')
          cd build
          ORIGINAL_UF2=$(ls *.uf2 | head -n 1)
          NEW_UF2="${TIMESTAMP}_${ORIGINAL_UF2}"
          mv "$ORIGINAL_UF2" "$NEW_UF2"
          echo "RENAMED_UF2_NAME=$NEW_UF2" >> $GITHUB_ENV

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RENAMED_UF2_NAME }}
          path: build/*.uf2
