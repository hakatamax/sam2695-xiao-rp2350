# ============================================================================
# Project: SAM2695 Emulator for XIAO RP2350
# File: .github/workflows/build.yml
# Version: v1.0.3
# Date: 2026-10-08
# Description: GitHub Actions Workflow for Building RP2350 UF2 Firmware
# ============================================================================

name: Build RP2350 UF2

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # C++標準ライブラリ (g++-arm-none-eabi, libstdc++) を含めて最小限インストール
      - name: Install Build Tools & Arm C++ Toolchain
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            make \
            cmake \
            gcc-arm-none-eabi \
            g++-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Setup Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/pico-sdk.git
          cd pico-sdk
          git submodule update --init
          echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> $GITHUB_ENV

      - name: Build Firmware
        run: |
          mkdir build && cd build
          cmake -DPICO_BOARD=pico2 -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk ..
          make -j$(nproc)

      - name: Rename UF2 with Timestamp
        run: |
          TIMESTAMP=$(TZ=Asia/Tokyo date +'%Y%m%d_%H%M%S')
          cd build
          ORIGINAL_UF2=$(ls *.uf2 | head -n 1)
          NEW_UF2="${TIMESTAMP}_${ORIGINAL_UF2}"
          mv "$ORIGINAL_UF2" "$NEW_UF2"
          echo "RENAMED_UF2_NAME=$NEW_UF2" >> $GITHUB_ENV

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RENAMED_UF2_NAME }}
          path: build/*.uf2
